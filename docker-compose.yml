version: '3.8'

services:
  # DiaGuard Backend Inference API
  api:
    build: .
    container_name: diaguard-api
    ports:
      - "8000:8000"
    command: uvicorn src.api:app --host 0.0.0.0 --port 8000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # DiaGuard Clinical Frontend Dashboard
  ui:
    build: .
    container_name: diaguard-ui
    ports:
      - "8501:8501"
    command: streamlit run src/app.py --server.port 8501 --server.address 0.0.0.0
    depends_on:
      - api
    restart: unless-stopped
